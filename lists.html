
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>箇条書きの例</title>
</head>
<body>
  <h1>3種類の箇条書き</h1>

  <h2>1. 普通の箇条書き</h2>
  <ul>
    <li>りんご</li>
    <li>みかん</li>
    <li>ぶどう</li>
  </ul>

  <h2>2. 順番つき箇条書き</h2>
  <ol>
    <li>起きる</li>
    <li>朝ごはんを食べる</li>
    <li>学校へ行く</li>
  </ol>

  <h2>3. 説明つき箇条書き</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Webページの構造を作る言語</dd>

    <dt>CSS</dt>
    <dd>見た目を整える言語</dd>

    <dt>JavaScript</dt>
    <dd>動きをつける言語</dd>
  </dl>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    strong {
      color: blue;
    }
  </style>
</head>
<body>
  <p>
    Webページの見た目を整えるためには、<strong>CSS</strong>を使用します。
    <strong>CSS</strong>を使えば、文字の色や大きさ、配置などを自由に変更できます。
    今回は特定の<strong>キーワード</strong>を青色で強調表示する練習を行います。
  </p>
</body>
</html>
